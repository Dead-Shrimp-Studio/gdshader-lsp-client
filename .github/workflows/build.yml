name: Build Extension

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Automatically cancel redundant builds on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build & Test (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint, and bundle
        run: npm run compile

      # Run tests inside a virtual display frame on Linux
      - name: Run tests
        run: xvfb-run npx vscode-test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --skip-license

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdshader-lsp-client-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14